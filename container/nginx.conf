worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Podman may assign a new dashboard IP after a restart. Resolve its service
    # name through the internal network DNS instead of pinning the boot-time IP.
    resolver @AZRAEL_DNS_RESOLVERS@ valid=5s ipv6=off;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        set $dashboard_service dashboard;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location /api/ {
            proxy_pass http://$dashboard_service:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 210s;
        }

        location = /healthz {
            proxy_pass http://$dashboard_service:8765/healthz;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
